[project]
name = "assist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SARATH S", email = "sarathpvtmail@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "pillow>=13.0.0",
    "python-decouple>=3.8",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
    "whitenoise>=6.12.0",
]

[project.scripts]
assist = "assist:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

